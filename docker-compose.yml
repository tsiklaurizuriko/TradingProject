services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-TradingProject}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-TradingProject}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__TradingPlatform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-TradingProject};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-admin}
      ConnectionStrings__Redis: redis:6379
      Trading__LiveTradingEnabled: "false"
      Trading__HostBotEngine: "false"
      Trading__AutoStartSamplePaperBot: "true"
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: deploy/docker/workers.Dockerfile
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__TradingPlatform: Host=postgres;Port=5432;Database=${POSTGRES_DB:-TradingProject};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-admin}
      ConnectionStrings__Redis: redis:6379
      Trading__LiveTradingEnabled: "false"
      Trading__HostBotEngine: "true"
      Trading__AutoStartSamplePaperBot: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
